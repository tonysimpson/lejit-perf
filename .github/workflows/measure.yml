name: Measure

# One attempt at counting: if this runner's CPU gives perf an instruction
# count, count LeJIT at `ref` and at `base` here; if not, say retry.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        required: true
    outputs:
      retry:
        value: ${{ jobs.measure.outputs.retry }}
      cpu:
        value: ${{ jobs.measure.outputs.cpu }}

jobs:
  measure:
    runs-on: ubuntu-24.04
    outputs:
      retry: ${{ steps.check.outputs.retry }}
      cpu: ${{ steps.check.outputs.cpu }}
    steps:
      - name: Install perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" ||
            sudo apt-get install -y linux-tools-common linux-tools-azure
          sudo sysctl kernel.perf_event_paranoid=1
      - name: Check the CPU's counters
        id: check
        run: |
          cpu="$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          vendor="$(grep -m1 '^vendor_id' /proc/cpuinfo | cut -d: -f2- | xargs)"
          out="$(perf stat -x, -e instructions:u -- true 2>&1 >/dev/null || true)"
          echo "$out"
          n="$(echo "$out" | cut -d, -f1 | grep -E '^[0-9]+$' || true)"
          echo "cpu=$vendor $cpu" >> "$GITHUB_OUTPUT"
          if [ -n "$n" ]; then
            echo "$vendor $cpu: counted $n instructions"
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "$vendor $cpu: no instruction count, so another runner will try"
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.retry == 'false'
        uses: actions/checkout@v4
      - if: steps.check.outputs.retry == 'false'
        uses: actions/checkout@v4
        with:
          repository: tonysimpson/lejit
          ref: ${{ inputs.ref }}
          path: new
          fetch-depth: 0
      - if: steps.check.outputs.retry == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.16"
      - name: Build both
        if: steps.check.outputs.retry == 'false'
        run: |
          sudo apt-get install -y --no-install-recommends libffi-dev libunwind-dev
          git -C new worktree add --detach ../base "$(git -C new rev-parse '${{ inputs.base }}')"
          echo "new:  $(git -C new log -1 --format='%h %s')"
          echo "base: $(git -C base log -1 --format='%h %s')"
          make -C new PY=python
          make -C base PY=python
          python -m compileall -q tools new/lejit base/lejit
      - name: Count
        if: steps.check.outputs.retry == 'false'
        run: |
          for d in base new; do
            for what in warm cold; do
              prlimit --as=4000000000 python tools/instrcount.py "$what" --lejit "$d" > "$what-$d.txt"
            done
          done
      - name: Compare
        if: steps.check.outputs.retry == 'false'
        run: |
          python - <<'EOF'
          def read(f):
              return {l.split()[0]: int(l.split()[1]) for l in open(f) if l.strip()}
          for what in ('warm', 'cold'):
              base, new = read(what + '-base.txt'), read(what + '-new.txt')
              print('%-24s %15s %15s %8s' % (what, 'base', 'new', 'change'))
              for k in base:
                  print('%-24s %15d %15d %+7.2f%%' % (k, base[k], new[k], 100.0 * (new[k] - base[k]) / base[k]))
              print()
          EOF
