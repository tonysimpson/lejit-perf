name: Instruction counts

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: LeJIT commit to count (a full SHA or a branch)
        default: main
      base:
        description: LeJIT commit to compare it with
        default: main^

jobs:
  measure:
    uses: ./.github/workflows/measure.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      base: ${{ inputs.base || 'main^' }}
      perf-ref: ${{ github.sha }}
