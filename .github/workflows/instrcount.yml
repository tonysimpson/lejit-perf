name: Instruction counts

# GitHub's AMD runners hide the hardware counters, so up to three runners
# are tried in turn, each a fresh machine, until one has them.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: LeJIT commit to count
        default: main
      base:
        description: LeJIT commit to compare it with
        default: main^

jobs:
  attempt1:
    uses: ./.github/workflows/measure.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      base: ${{ inputs.base || 'main^' }}
  attempt2:
    needs: attempt1
    if: needs.attempt1.outputs.retry == 'true'
    uses: ./.github/workflows/measure.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      base: ${{ inputs.base || 'main^' }}
  attempt3:
    needs: attempt2
    if: needs.attempt2.outputs.retry == 'true'
    uses: ./.github/workflows/measure.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      base: ${{ inputs.base || 'main^' }}
  result:
    name: instruction counts (3.10)
    needs: [attempt1, attempt2, attempt3]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "attempt 1: ${{ needs.attempt1.result }}, ${{ needs.attempt1.outputs.cpu }}"
          echo "attempt 2: ${{ needs.attempt2.result }}, ${{ needs.attempt2.outputs.cpu }}"
          echo "attempt 3: ${{ needs.attempt3.result }}, ${{ needs.attempt3.outputs.cpu }}"
          for a in 1:${{ needs.attempt1.result }}:${{ needs.attempt1.outputs.retry }} \
                   2:${{ needs.attempt2.result }}:${{ needs.attempt2.outputs.retry }} \
                   3:${{ needs.attempt3.result }}:${{ needs.attempt3.outputs.retry }}; do
            IFS=: read -r n result retry <<< "$a"
            if [ "$result" = success ] && [ "$retry" = false ]; then
              echo "attempt $n measured"
              exit 0
            elif [ "$result" != success ]; then
              echo "attempt $n: $result"
              exit 1
            fi
          done
          echo "no runner had hardware counters"
          exit 1
